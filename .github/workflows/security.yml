name: security

on:
  pull_request:
  push:
    branches:
      - bootstrap/baseline
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    if: github.event_name == 'pull_request' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: high
          vulnerability-check: true
          license-check: true

  static-analysis:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_VERSION: "8.30.1"
      - name: Filesystem and configuration scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          trivyignores: .trivyignore.yaml
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: false
          format: table
          version: v0.74.0
      - name: Dockerfile lint base
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387
        with:
          dockerfile: images/base/Dockerfile
          failure-threshold: warning
      - name: Dockerfile lint full
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387
        with:
          dockerfile: images/full/Dockerfile
          failure-threshold: warning
      - name: Shell lint
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38
        env:
          SHELLCHECK_OPTS: -e SC2329
        with:
          scandir: scripts
      - name: Workflow lint
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca
      # Los comandos make citados en la documentación tienen que existir
      # como target. Se colaron seis que no, en el Inicio rápido del README.
      - name: Comandos documentados
        run: make doc-targets-check

      # Al fusionar light en full, compose.yaml y compose.vpn-inside.yaml
      # se quedaron apuntando a una imagen y un Dockerfile que ya no
      # existian. `docker compose config` no lo detecta porque solo
      # renderiza, asi que el fallo salia en el primer compose build.
      - name: Referencias de compose
        run: make compose-refs-check

      # El texto de make help es un bloque enorme de comillas simples en
      # una sola linea. Partirlo crea una regla espuria que solo se ve con
      # GNU Make 4.x, asi que este guard tiene que correr en CI y no solo
      # en el portatil.
      - name: Estructura del Makefile
        run: make makefile-check

  # Decide si este PR toca la imagen. El build completo tarda mas de 90
  # min en un runner de 2 nucleos, y el repo es privado, o sea que cada
  # minuto se factura. Sin este filtro, un PR que solo toca un README
  # pagaria el build entero.
  #
  # Se calcula con git en vez de con dorny/paths-filter para no anadir una
  # dependencia externa que mantener pinneada.
  build-scope:
    name: detectar cambios en la imagen
    runs-on: ubuntu-24.04
    outputs:
      changes: ${{ steps.scope.outputs.changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Hace falta el lado base del PR para poder comparar. Sin esto
          # el base sha no esta en el clon y el diff no se puede hacer.
          fetch-depth: 0

      # Las rutas vigiladas las saca el propio script de los COPY de los
      # Dockerfiles, no una lista escrita a mano: un filtro a mano se
      # queda viejo y acaba sin detectar lo que queria detectar.
      #
      # En push y en el cron semanal siempre se construye: de ahi sale la
      # garantia de que bootstrap/baseline es construible.
      - name: ¿Cambio la imagen?
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo 'changes=true' >> "$GITHUB_OUTPUT"
            echo 'push o cron: se construye siempre'
            exit 0
          fi
          if /bin/sh scripts/verify/image-scope.sh "$BASE_SHA" HEAD; then
            echo 'changes=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changes=false' >> "$GITHUB_OUTPUT"
            echo 'sin cambios en la imagen: se omite el build'
          fi

  # La imagen nunca se construyo en ningun sitio: los jobs de arriba solo
  # la linteaban. Por eso un ARG declarado fuera de etapa (`PAT_COMMIT is
  # required`) y un compose apuntando a un Dockerfile ya borrado pudieron
  # entrar sin que nada los viera. Hadolint no los ve porque el Dockerfile
  # es sintacticamente valido en los dos casos.
  #
  # El runner es amd64, de modo que el build es NATIVO: ademas de cubrir
  # el Dockerfile, valida la imagen en la segunda arquitectura sin pagar la
  # emulacion, que desde un portatil arm64 son horas.
  image-build:
    name: build imagen (amd64 nativo)
    needs: build-scope
    # NO corre en pull_request. El build completo no cabe en un runner de
    # 2 nucleos por un margen que todavia no se ha medido, y el repo es
    # privado, asi que cada minuto se factura. Ponerlo en cada PR
    # significaba pagar mas de hora y media de runner por un cambio de
    # README. Aqui se ejecuta al llegar a bootstrap/baseline, en el cron
    # semanal y a mano, que es donde se necesita la garantia: que la rama
    # por defecto es construible y que la imagen existe en amd64.
    if: github.event_name != 'pull_request' && needs.build-scope.outputs.changes == 'true'
    runs-on: ubuntu-24.04
    # Medido: en un runner de 2 nucleos el build completo NO termina en 90
    # min (lo cancelo a 1h35m sin acabar). Como este job ya no corre en cada
    # PR sino al llegar a la rama por defecto y semanalmente, el limite se
    # sube a 300 min: son minutos pocos y caros, pero mejor que un build
    # que se corta a medias y no prueba nada.
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # Se invoca el target del Makefile y no un `docker build` aparte:
      # una sola forma de construir la imagen, la misma que corre en local
      # y la que produce el tag y la etiqueta de insumos.
      - name: Construir seclab-sbf:full
        run: make build-full BUILD_PLATFORM=linux/amd64 BUILD_TAG=-amd64

      # Con la imagen ya presente, el gate de CVEs deja de ser solo local.
      # Trivy 0.74.0 por digest y el .trivyignore del repo, que es quien
      # maqueta la excepcion de root.
      - name: Escanear CVEs
        run: make scan-image SCAN_IMAGE=seclab-sbf:full-amd64

      # Construir bien no es lo mismo que servir las 49 herramientas: un
      # paquete que cambio de nombre, o una entrada del manifiesto que no
      # llego a instalarse, no los detecta ni el build ni el escaneo.
      - name: Herramientas del manifiesto en la imagen
        run: make image-tools-check SCAN_IMAGE=seclab-sbf:full-amd64

  # La jail de fail2ban es lo unico de la configuracion de host que se
  # puede validar sin un nodo. Levanta un contenedor con la imagen base
  # por digest, el mismo snapshot de Ubuntu que usan los Dockerfiles, y
  # comprueba que fail2ban acepta la jail y que su filtro cuenta los
  # fallos de autenticacion. El ban efectivo en nftables no se comprueba
  # aqui: eso necesita un host Linux de verdad.
  fail2ban-jail:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Validar la jail
        run: make fail2ban-jail-check

  terraform:
    runs-on: ubuntu-24.04
    env:
      # Los stacks exigen >= 1.16.0. Version y SHA-256 fijados, el mismo
      # criterio que usa cloud-init para el plugin de Docker Compose.
      TERRAFORM_VERSION: 1.16.0
      TERRAFORM_SHA256: 41d05b927aa174f15d1228c4eba832a323b716c68b415ef5a00179f46cc602d3
      # tflint 0.64.0, checksum del checksums.txt de su release.
      TFLINT_VERSION: 0.64.0
      TFLINT_SHA256: cca9d13e2e1d7a2c627af60ff899a3c9b74212899416aeb96ec764d2ef954537
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      # La imagen del runner no trae Terraform. Se instala aqui, con hash
      # verificado, en vez de meter la accion de setup de HashiCorp: es
      # una dependencia menos que auditar y fijar por SHA.
      - name: Instalar Terraform
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip" \
            --output /tmp/terraform.zip
          printf '%s  %s\n' "$TERRAFORM_SHA256" /tmp/terraform.zip | sha256sum -c -
          unzip -o -q /tmp/terraform.zip -d /usr/local/bin
          terraform version
      - name: Formato
        run: terraform fmt -check -recursive terraform/
      # -backend=false: valida sin state remoto ni credenciales. Los
      # .terraform.lock.hcl estan versionados, asi que los providers
      # resueltos son los mismos que en local.
      - name: Validar stacks
        run: |
          for stack in oci azure digitalocean; do
            echo "== $stack =="
            terraform -chdir="terraform/stacks/$stack" init -backend=false -input=false
            terraform -chdir="terraform/stacks/$stack" validate
          done
      # El render del cloud-init es lo que terraform validate no cubre:
      # la plantilla compila igual con el bloque `content: |` roto. El
      # check necesita un parser YAML; PyYAML no viene en la imagen del
      # runner, asi que se instala aqui, con version y hash fijos en
      # .github/requirements-ci.txt.
      - name: Render del cloud-init
        run: |
          python3 -m pip install --disable-pip-version-check --only-binary :all: --require-hashes -r .github/requirements-ci.txt
          make tf-render-check
      # tflint con el ruleset terraform embebido en el binario. Los
      # plugins del registro no se activan (.tflint.hcl): cada uno seria
      # una dependencia mas que descargar en tiempo de ejecucion.
      - name: Lint de Terraform
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            "https://github.com/terraform-linters/tflint/releases/download/v${TFLINT_VERSION}/tflint_linux_amd64.zip" \
            --output /tmp/tflint.zip
          printf '%s  %s\n' "$TFLINT_SHA256" /tmp/tflint.zip | sha256sum -c -
          unzip -o -q /tmp/tflint.zip -d /usr/local/bin
          make tflint-check
