title = "seclab-sbf"

[extend]
useDefault = true

[[allowlists]]
description = "Local VPN, workspace, environment and SSH secrets are never versioned"
paths = [
  '''(^|/)\.env($|\.)''',
  '''(^|/)vpn/''',
  '''(^|/)workspace/''',
  '''(^|/)\.secrets/''',
  # Ficheros locales no versionados que falsean el gate: tmp/ es scratch,
  # y los .tfvars llevan credenciales de Terraform que .gitignore ya excluye.
  '''(^|/)tmp/''',
  '''\.tfvars$'''
]
