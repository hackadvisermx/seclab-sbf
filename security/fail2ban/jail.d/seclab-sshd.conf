# Jail de sshd del host. Se escribe en /etc/fail2ban/jail.d/ por
# cloud-init (terraform/modules/lab-cloud-init/cloud.cfg.yaml), que lo
# copia desde este archivo: este es el unico lugar donde se edita.
#
# Contexto: el host no tiene public_ip y su sshd solo es alcanzable por
# Tailscale. Esta jail no sustituye a las ACL, al MFA ni al device
# approval del tailnet; solo frena a un nodo del tailnet que insiste con
# autenticaciones fallidas.
#
# No cubre el sshd del CONTENEDOR: sus logs no salen del contenedor.
# Ver security/fail2ban/README.md.

[sshd]
enabled = true

# El host no corre rsyslog: /var/log/auth.log no existe. El backend
# systemd lee el journal. No se define logpath a proposito: con este
# backend fail2ban lo declara invalido (ver jail.conf, backend=systemd).
backend = systemd
port = ssh

# Solo loopback. La IP de Tailscale del operador NO se ignora: ignorar
# 100.64.0.0/10 dejaria la jail sin efecto sobre el unico trafico que
# alcanza el sshd. Si un nodo se banea a si mismo, se libera con
# `fail2ban-client set sshd unbanip <ip>` por consola serie.
ignoreip = 127.0.0.1/8 ::1

# fail2ban usa su propia tabla (f2b-table). La politica del laboratorio
# vive en inet seclab_security, asi que un `nft delete table inet
# seclab_security` no se lleva los bans, y al reescribir una no se pisa
# la otra. El default de jail.conf es iptables-multiport, que en Ubuntu
# 24.04 acaba delegando en nftables por iptables-nft: se fija aqui para
# no depender de esa traduccion.
banaction = nftables-multiport

# sshd_config ya fija MaxAuthTries 3. Con 5 fallos en 10 min se ban 1h.
maxretry = 5
findtime = 10m
bantime = 1h

# Ban incremental x2 por reincidencia, hasta 1 semana, y un desajuste
# aleatorio de hasta 10 min para que el fin del ban no sea predecible.
bantime.increment = true
bantime.factor = 2
bantime.maxtime = 1w
bantime.rndtime = 10m
