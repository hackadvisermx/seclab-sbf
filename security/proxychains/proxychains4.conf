# Configuracion de Proxychains4 para SecLab-SBF
# Por defecto redirige conexiones TCP a traves del proxy SOCKS5 local (p. ej. chisel o ssh -D)

# dynamic_chain: salta proxies caidos en vez de abortar la conexion completa
dynamic_chain

# Resuelve DNS de forma remota a traves del proxy para evitar fugas (DNS leaks)
proxy_dns

# Subred virtual para resolucion remota de DNS
remote_dns_subnet 224

# Tiempos de espera en milisegundos
tcp_read_time_out 15000
tcp_connect_time_out 8000

# quiet_mode: suprime mensajes de inicializacion de libreria para no ensuciar salidas y pipes
quiet_mode

[ProxyList]
# Proxy predeterminado: listener SOCKS5 local (chisel / ssh -D)
socks5  127.0.0.1 1080
