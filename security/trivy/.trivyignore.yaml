  - id: CVE-2026-42245
    statement: >-
      net-imap 0.4.19, gem por defecto de Ruby 3.3.8. Mismo origen que
      CVE-2026-42257: el 0.6.7 corregido esta instalado y es el que activa
      bundler, el vulnerable sigue en disco por ser default gem.
    expired_at: 2026-12-31

  - id: CVE-2026-67432
    statement: >-
      mcp 0.13.0. Mismo origen que CVE-2026-67431: el gemspec de
      metasploit-framework 6.5.5 lo fija con version exacta ('0.13.0'), no con
      un rango, asi que no se puede subir sin parchear el upstream.
    expired_at: 2026-12-31

  - id: GHSA-6v7p-g79w-8964
    statement: >-
      msgpack 1.1.2. Trivy lo reporta sin PkgPath, o sea que no lo lee de
      ningun fichero del sistema de ficheros: sale de metadatos de Python que
      no corresponden a un paquete instalado. En la imagen revisada el venv de
      NetExec tiene setuptools 84.0.0, cryptography 50.0.1 y pyopenssl 26.4.0,
      y no hay msgpack ni en el venv ni en el python del sistema. Sin codigo
      instalado en runtime.
    expired_at: 2026-12-31

  - id: CVE-2025-47273
    statement: >-
      setuptools 70.3.0. Sin PkgPath, igual que msgpack: no viene de un
      fichero del disco. El venv de NetExec lleva setuptools 84.0.0, muy por
      encima del 78.1.1 fijado como minimo en el build, asi que la copia que
      reporta Trivy no es la que se usa.
    expired_at: 2026-12-31

  # ---------------------------------------------------------------------------
  # mcp, pineado por Metasploit.
  #
  # metasploit-framework.gemspec declara `spec.add_runtime_dependency 'mcp',
  # '0.13.0'` con version exacta, no un rango. Corregido en >= 0.23.0, asi que
  # subirlo exige parchear el gemspec de Metasploit, es decir, dejar de
  # compilar el commit tal cual. No se hace a proposito.
  # ---------------------------------------------------------------------------

  - id: CVE-2026-67431
    statement: >-
      mcp 0.13.0. El gemspec de metasploit-framework 6.5.5 lo fija con
      version exacta ('0.13.0'), no con un rango, asi que no se puede subir sin
      parchear el upstream. Corregido en >= 0.23.0.
    expired_at: 2026-12-31

  # ---------------------------------------------------------------------------
  # Nota sobre lo que NO esta aqui.
  #
  # Las 167 de linux-libc-dev (cabeceras del kernel, sin codigo ejecutable) no
  # necesitan entrada: no tienen parche en el snapshot de Ubuntu, asi que
  # `ignore-unfixed: true` en el job de full ya las descarta.
  #
  # Tampoco estan los gems que si se arreglaron: concurrent-ruby sube a >= 1.3.7
  # y los paquetes de Python de NetExec a cryptography >= 46.0.5,
  # pyOpenSSL >= 26.0.0 y setuptools >= 78.1.1, todo verificado en el build.
  #
  # Si anadeis aqui un CVE que si tiene parche disponible, escondais un
  # hallazgo corregible. La intencion es que esta lista solo contenga lo que de
  # verdad no se puede arreglar sin reconstruir Ruby o tocar un pin de upstream.
  # ---------------------------------------------------------------------------
