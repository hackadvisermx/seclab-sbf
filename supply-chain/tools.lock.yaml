    built_from_source: true
    # Se compila y no se descarga porque NO existe release para aarch64.
    # pspy v1.2.1 publica pspy32, pspy32s, pspy64 y pspy64s, y `file` sobre
    # pspy64 devuelve "ELF 64-bit LSB executable, x86-64". Tampoco hay asset arm
    # en v1.2.0 ni en v1.1.0. El SHA256 del release x86-64
    # (c93f29a5...) NO sirve para arm64, asi que en Apple Silicon hay que
    # compilarlo, igual que naabu, bettercap y s3scanner.
    assets:
      linux/amd64:
