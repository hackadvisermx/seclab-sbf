    source: https://rubygems.org/gems/wpscan/4.1.0/
    gem_home: /opt/wpscan-gems
    wrapper: scripts/wpscan-wrapper.sh
    note: escaner de WordPress. Se instala en un GEM_HOME propio para no tocar el
         bundle bloqueado de Metasploit con el que comparte nokogiri.
  - name: zsteg
    version: 0.2.14
    source: https://rubygems.org/gems/zsteg/0.2.14/
    gem_home: /opt/zsteg-gems
    wrapper: scripts/zsteg-wrapper.sh
    dependencies: [iostruct >= 0.7.0, prime, zpng >= 0.4.6]
    note: extraccion de datos esteganograficos. Ruby puro, pero se compila en
         msf-builder junto a wpscan por si alguna dependencia suya trae extension.
         Bug conocido de 0.2.14 - el atajo `zsteg -e lsb` aborta con
         NoMethodError porque decode_param_string no rellena channels si no se
         indica ninguno. Hay que pasar siempre los canales, por ejemplo
         `zsteg -e b1,lsb,rgba`. El informe sin -e (`zsteg fichero`) si
         funciona. Es la ultima version publicada, asi que no hay una corregida.
python:
  - name: pwntools
    version: 4.15.0
    requirements:
      - scripts/pwntools-requirements-aarch64.txt
      - scripts/pwntools-requirements-x86_64.txt
    note: >-
      34 paquetes con hashes por arquitectura. Los hashes son POR VERSION DE
      PYTHON, no por version del paquete: el mismo cffi 2.1.1 tiene binarios
      distintos para cp312 y cp314, con hash distinto cada uno. Al subir a
      Python 3.14 (migracion a Ubuntu 26.04) hubo que rehacer los dos ficheros
      con `pip download --python-version 3.14 --abi cp314` y sha256 sobre el
      wheel exacto. El build lo detecto solo y fallo: es la prueba de que el
      pin funciona. Tres paquetes bajaron de version y cada uno por un motivo
      medido, no por conveniencia: unicorn 2.1.2 -> 2.1.1 porque la 2.1.2 no
      publica wheel para cp314 y la 2.1.4 si publica pero pwntools 4.15.0 la
      excluye (exige >=2.0.1,!=2.1.3,!=2.1.4); psutil 7.2.2 -> 7.1.1 porque
      el 7.2.2 no tiene wheel x86_64 para cp314; y packaging 26.3 -> 26.0
      porque el snapshot de 26.04 solo tiene 26.0 y es la que instala dpkg, y
      con 26.3 pip intenta desinstalar la del sistema y falla con "no RECORD
      file". pwntools pide `packaging` sin fijar version, asi que 26.0 cumple.
