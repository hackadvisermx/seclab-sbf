python_packages_full:
  - name: netexec
    version: 1.5.1
    source: https://github.com/Pennyw0rth/NetExec.git
    commit: c7dc286ba65daf10402cdc470e531b84e6d3d911
    tag: v1.5.1
    note: no esta en PyPI; se instala desde git fijado al commit, igual que metasploit.
         Varias dependencias se compilan desde fuente, por eso no se puede fijar con hashes por arquitectura.
         Expone nxc, netexec, NetExec y nxcdb. Instala en /opt/nxc y escribe ~/.nxc, que es symlink al volumen.
    runtime: /opt/nxc
    python: 3.12 (imagen base Ubuntu 24.04)
    build_deps: build-essential, cargo, git, pkg-config, libffi-dev, libssl-dev, python3-dev
    frozen:
      - "Flask==3.1.3"
      - "Jinja2==3.1.6"
      - "MarkupSafe==3.0.3"
      - "PyNaCl==1.6.2"
