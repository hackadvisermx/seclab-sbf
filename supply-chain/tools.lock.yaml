    sha256: a948a9d105594931b083ce864c4019ffe137f3b30cba6ddf0bec331da748147d
    # Es un script, no un binario: el SHA256 es el del fichero exacto de ese
    # tag y no cambia entre arquitecturas. El tag lleva la v delante
    # (v1.3.10): sin ella raw.githubusercontent devuelve 404, que es como se
    # rompio el build la primera vez.
    #
    # Su shebang se reescribe en el Dockerfile a /opt/nxc/bin/python3 porque
    # necesita impacket, y en esta imagen impacket solo existe dentro del venv
    # de NetExec. ldap3 tambien esta ahi; PyYAML se instala en el venv con pip
    # (PyYAML==6.0.3) y ademas como python3-yaml de apt. Con el python del
    # sistema la tool no arranca: ModuleNotFoundError.
    interpreter: /opt/nxc/bin/python3
    requirements: [impacket>=0.9.21, ldap3, PyYAML>=5.1]
    note: >-
      Enumeracion SMB/LDAP/NBNS de Windows. Complementa a smbclient y rpcclient
      a pelo. Solo entra en la imagen full.
