  - name: zsteg
    version: 0.2.14
    source: https://rubygems.org/gems/zsteg/0.2.14/
    gem_home: /opt/zsteg-gems
    wrapper: scripts/zsteg-wrapper.sh
    dependencies: [iostruct >= 0.7.0, prime, zpng >= 0.4.6]
    note: extraccion de datos esteganograficos. Ruby puro, pero se compila en
         msf-builder junto a wpscan por si alguna dependencia suya trae extension.
         Bug conocido de 0.2.14 - el atajo `zsteg -e lsb` aborta con
         NoMethodError porque decode_param_string no rellena channels si no se
         indica ninguno. Hay que pasar siempre los canales, por ejemplo
         `zsteg -e b1,lsb,rgba`. El informe sin -e (`zsteg fichero`) si
         funciona. Es la ultima version publicada, asi que no hay una corregida.
