    go_directive: 1.18
    cgo: false
    package: .
    note: wrapper de grep con soporte de patrones JSON para analisis de URLs y parametros.
  - name: qsreplace
    version: 0.0.3
    source: https://github.com/tomnomnom/qsreplace
    commit: 320475befaf66d986400aa8c3ed9b43e0b6b5a02
    tag: v0.0.3
    builder: docker.io/library/golang:1.26.8@sha256:6c2a5538f964f1c82f97ad14988bf05de100d922d159d0e398b54c7b0ca0c6c9
    go: 1.26.8
    go_directive: 1.18
    cgo: false
    package: .
    note: reemplazo masivo de query parameters en URLs para fuzzing e inyeccion de payloads.
  - name: bettercap
    version: 2.41.7
    source: https://github.com/bettercap/bettercap
    commit: dfe56780bb342b6a6715c9557a2cefe1f13d805c
    tag: v2.41.7
    builder: docker.io/library/golang:1.26.8@sha256:6c2a5538f964f1c82f97ad14988bf05de100d922d159d0e398b54c7b0ca0c6c9
    go: 1.26.8
    go_directive: 1.23.0
    cgo: true
    cgo_reason: github.com/google/gousb v1.1.3 es dependencia directa y no tiene
                build tag que la excluya, asi que no hay build sin cgo posible.
                Ademas gopacket/pcap pide pcap.h, de ahi libpcap-dev en el
                builder; en runtime el pcap ya lo aporta el toolkit (libpcap0.8t64).
    bumps:
      # Llega por antchfx/jsonquery. CVE-2026-32287 es DoS por bucle infinito
      # al evaluar un boolean XPath.
      - module: github.com/antchfx/xpath
        from: v1.3.4
        to: v1.3.6
        cves: [CVE-2026-32287]
    cgo_requires:
      # El builder es Debian trixie (imagen golang oficial); el runtime es
      # Ubuntu noble. Solo tiene que coincidir el soname libusb-1.0.so.0.
      build:
        distro: debian-trixie
        packages:
          - gcc=4:14.2.0-1
          - libpcap-dev=1.10.5-2
          - libusb-1.0-0-dev=2:1.0.28-1
      runtime:
        distro: ubuntu-noble-snapshot-20260925
        packages:
          - libusb-1.0-0=2:1.0.27-1
    package: .
    note: suite MITM/spoofing. Solo entra en la imagen full. Su release oficial
          solo trae linux_amd64, asi que en arm64 se compila desde este commit
          con el mismo patron de cross-compile que usa naabu.
  - name: s3scanner
    version: 3.1.1
    source: https://github.com/sa7mon/s3scanner
    commit: 9c61311a2f7610e523cfc8194abb98ab96c584d2
    tag: v3.1.1
    builder: docker.io/library/golang:1.26.8@sha256:6c2a5538f964f1c82f97ad14988bf05de100d922d159d0e398b54c7b0ca0c6c9
    go: 1.26.8
    go_directive: 1.22.0
    cgo: false
    package: .
    bumps:
      # Trae pgx 5.5.5, con CVE-2026-33815 y CVE-2026-33816 (CRITICAL,
      # memory safety). Se sube a la version corregida, como ya hace naabu.
      - module: github.com/jackc/pgx/v5
        from: v5.5.5
        to: v5.9.0
        cves: [CVE-2026-33815, CVE-2026-33816]
    note: enumera buckets S3. Solo entra en la imagen full.
  - name: pspy
    version: 1.2.1
    source: https://github.com/DominicBreuker/pspy
    commit: f9e6a1590a4312b9faa093d8dc84e19567977a6d
    builder: docker.io/library/golang:1.26.8@sha256:6c2a5538f964f1c82f97ad14988bf05de100d922d159d0e398b54c7b0ca0c6c9
    go: 1.26.8
    go_directive: 1.20
    cgo: false
    package: .
    built_from_source: true
    # Se compila y no se descarga porque NO existe release para aarch64.
    # pspy v1.2.1 publica pspy32, pspy32s, pspy64 y pspy64s, y `file` sobre
    # pspy64 devuelve "ELF 64-bit LSB executable, x86-64". Tampoco hay asset arm
    # en v1.2.0 ni en v1.1.0. El SHA256 del release x86-64
    # (c93f29a5...) NO sirve para arm64, asi que en Apple Silicon hay que
    # compilarlo, igual que naabu, bettercap y s3scanner.
    assets:
      linux/amd64:
        file: pspy
        sha256: 0cad8b62f6693ce5f6dca8a467cb1af1bbb60fc34e8cb9145d2c9b40a2f5bced
      linux/arm64:
        file: pspy
        sha256: 7434a572496d55ba463d107c5adc19c0f1d3c7e410fa5cafd040d4be2b4d2e18
    verify: >-
      El stage comprueba git rev-parse HEAD contra el commit fijado y
      describe --tags --exact-match contra v1.2.1; el build falla si no coinciden.
    note: >-
      Vigila procesos y eventos de filesystem en tiempo real. Lee /proc, asi que
      sin privilegios solo ve lo del usuario actual. Solo entra en la imagen full.
  - name: chisel
    version: 1.12.0
    source: https://github.com/jpillora/chisel
    commit: fe4f4fe7e6a849b4aa6d1b8ee47037e16033f42a
    builder: docker.io/library/golang:1.26.8@sha256:6c2a5538f964f1c82f97ad14988bf05de100d922d159d0e398b54c7b0ca0c6c9
    go: 1.26.8
    cgo: false
    package: .
    built_from_source: true
    dependency_overrides:
      golang.org/x/crypto: v0.56.0
      golang.org/x/net: v0.58.0
    payloads:
      - /usr/local/share/seclab/payloads/pivoting/chisel_linux_amd64
      - /usr/local/share/seclab/payloads/pivoting/chisel_linux_arm64
      - /usr/local/share/seclab/payloads/pivoting/chisel_windows_amd64.exe
    note: >-
      Tuneles TCP/UDP rapidos sobre HTTP/WebSockets con SSH embebido. Permite
      listeners SOCKS5 inversos e integracion con proxychains4.
  - name: ligolo-ng
    version: 0.9.2
    source: https://github.com/nicocha30/ligolo-ng
    commit: e543732f4be6dc899096ae322ae620bf010bfbfc
    builder: docker.io/library/golang:1.26.8@sha256:6c2a5538f964f1c82f97ad14988bf05de100d922d159d0e398b54c7b0ca0c6c9
    go: 1.26.8
    cgo: false
    package: ./cmd/proxy
    built_from_source: true
    dependency_overrides:
      golang.org/x/crypto: v0.56.0
      golang.org/x/net: v0.58.0
    payloads:
      - /usr/local/share/seclab/payloads/pivoting/ligolo_agent_linux_amd64
      - /usr/local/share/seclab/payloads/pivoting/ligolo_agent_linux_arm64
      - /usr/local/share/seclab/payloads/pivoting/ligolo_agent_windows_amd64.exe
    note: >-
      Herramienta avanzada de tunelado y pivoting de red con multiplexacion gVisor/yamux.
