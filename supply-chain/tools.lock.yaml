    verify: >-
      El stage comprueba git rev-parse HEAD contra el commit fijado y
      describe --tags --exact-match contra v1.2.1; el build falla si no coinciden.
    note: >-
      Vigila procesos y eventos de filesystem en tiempo real. Lee /proc, asi que
      sin privilegios solo ve lo del usuario actual. Solo entra en la imagen full.
