#cloud-config
# Módulo compartido de cloud-init para los stacks de seclab-sbf.
# No recibe secretos: ni .env, ni claves Tailscale, ni credenciales.
# Tailscale se instala y une MANUALMENTE por consola (ver docs/phase-8.md).
# Variables templatefile: admin_user, workspace_device, workspace_mount,
# admin_password (opcional, "" = sin contraseña; solo para login por
# consola serie; SSH sigue siendo solo con llave).
hostname: seclab-sbf
manage_etc_hosts: true
users:
  - name: ${admin_user}
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    ssh_authorized_keys:
      - ${ssh_public_key}
%{ if admin_password != "" }
chpasswd:
  list:
    - ${admin_user}:${admin_password}
  expire: false
%{ endif }
# Tailscale queda PREINSTALADO (versión fijada) para que el operador
# solo ejecute el join manual con one-off key. La unión, la revocación
# y la prohibición de Funnel/Exit Node siguen en security/tailscale/README.md.
# Llave del repo fijada (medida 2026-09-25 sobre TLS; fpr primaria
# 2596A99EAAB33821893C0A79458CA832957F5868): si el repo rota la llave,
# el apt update falla de forma visible y hay que actualizar este blob.
package_update: true
packages:
  - docker.io
  - docker-buildx
  - socat
  - make
  - git
  - open-iscsi
  - nftables
  - fail2ban
  - tailscale=1.102.4
  - unattended-upgrades
write_files:
  - path: /etc/fail2ban/jail.d/seclab-sshd.conf
    owner: root:root
    permissions: "0644"
    # Fuente unica de la jail: security/fail2ban/jail.d/seclab-sshd.conf.
    # Cada stack la pasa ya indentada como seclab_sshd_jail (el "\n" inicial
    # lo anade el stack: indent() no indenta la primera linea que recibe, y
    # sin el la cabecera [sshd] queda en la columna 0 y el YAML no es
    # valido). Se edita la jail en el repo, nunca aqui, para que la copia
    # del host se pueda comparar (make fail2ban-check avisa si divergen).
    content: |${seclab_sshd_jail}
  - path: /usr/share/keyrings/tailscale-archive-keyring.gpg
    owner: root:root
    permissions: "0644"
    encoding: b64
    content: 
  - path: /etc/apt/sources.list.d/tailscale.list
    owner: root:root
    permissions: "0644"
    content: |
      deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg] https://pkgs.tailscale.com/stable/ubuntu noble main
  - path: /etc/seclab-sbf/motd
    permissions: "0644"
    content: |
      seclab-sbf: host gestionado por Terraform. Sin puertos públicos.
      Acceso solo por Tailscale (unión manual). Ver docs/phase-8.md.
runcmd:
  - systemctl enable --now docker
  - usermod -aG docker ${admin_user}
  # Plugin compose oficial fijado (no existe en repos Ubuntu):
  # v5.5.1 linux-x86_64 con SHA-256 verificado.
  - mkdir -p /usr/libexec/docker/cli-plugins
  - curl --fail --location --proto '=https' --tlsv1.2 --retry 3 https://github.com/docker/compose/releases/download/v5.5.1/docker-compose-linux-x86_64 --output /usr/libexec/docker/cli-plugins/docker-compose
  - printf '%s  %s\n' 'db1889184726840f75c4f9c001048430d4f25b3be3cb084d3ddd762bc0aed576' /usr/libexec/docker/cli-plugins/docker-compose | sha256sum -c -
  - chmod 0755 /usr/libexec/docker/cli-plugins/docker-compose
  - systemctl enable --now fail2ban || true
  - systemctl enable --now iscsid || true
  - mkdir -p ${workspace_mount}
  - |
    if [ -b "${workspace_device}" ] && ! findmnt -n "${workspace_mount}" >/dev/null 2>&1; then
      if ! blkid -o value -s TYPE "${workspace_device}" >/dev/null 2>&1; then
        mkfs.ext4 -L seclab-workspace "${workspace_device}"
      fi
      UUID="$(blkid -o value -s UUID "${workspace_device}")"
      printf 'UUID=%s %s ext4 defaults,nofail 0 2\n' "$UUID" "${workspace_mount}" >> /etc/fstab
      mount "${workspace_mount}"
      chown ${admin_user}:${admin_user} "${workspace_mount}"
    fi
  - systemctl enable --now unattended-upgrades || true
final_message: "seclab-sbf listo. Une Tailscale manualmente y copia .env por SSH sobre el tailnet."
