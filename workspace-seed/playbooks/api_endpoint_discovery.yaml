# Playbook determinista: Descubrimiento de APIs y Endpoints Web
id: "pb_api_endpoint_discovery"
title: "Mapeo y Descubrimiento de Endpoints de APIs"
version: "1.0"
category: "api_audit"
description: "Detección de esquemas OpenAPI/Swagger, consolas GraphQL, rutas REST comunes y endpoints expuestos."
author: "SecLab-SBF"

steps:
  - id: "step_01_schema_probing"
    title: "Sondeo de Documentación OpenAPI y Swagger"
    objective: "Identificar rutas habituales de especificaciones de API (/swagger.json, /api-docs, /openapi.json)."
    interaction_type: "active_low"
    required_permissions:
      - "allow_active"
    target_selector: "in_scope_domains"
    inputs:
      - "target.yaml"
    command_template: "ffuf -w wordlists/api_endpoints.txt -u https://{domain}/FUZZ -mc 200,301,302 -o recon/api_schemas.json"
    timeout_seconds: 240
    expected_outputs:
      - "recon/api_schemas.json"
    success_criteria:
      file_exists: "recon/api_schemas.json"

  - id: "step_02_graphql_probing"
    title: "Detección y Sondeo de Endpoints GraphQL"
    objective: "Localizar interfaces GraphQL (/graphql, /api/graphql, /graphiql) y comprobar introspección básica."
    interaction_type: "active_low"
    required_permissions:
      - "allow_active"
    target_selector: "in_scope_domains"
    inputs:
      - "recon/api_schemas.json"
    command_template: "curl -s -X POST https://{domain}/graphql -H Content-Type:application/json -o recon/graphql_probe.json"
    timeout_seconds: 60
    expected_outputs:
      - "recon/graphql_probe.json"
    success_criteria:
      file_exists: "recon/graphql_probe.json"
